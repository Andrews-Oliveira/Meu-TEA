name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/fluxos-essenciais-meu-tea-20261117

permissions:
  contents: read

jobs:
  verificar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17 (baseline AGP)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 17
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes, compilacao e lint
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
