name: Android CI

on:
  pull_request:
    branches: [main, fix/fluxos-essenciais-meu-tea-20261117, feat/meu-tea-v2-modulos-20261117, feat/meu-tea-temas-perfil-20261117, feat/redesign-visual-integrado-20261117, feat/voz-pessoal-cartoes-20261117, feat/cartoes-foto-camera-20261118, feat/sessao-persistente-jogos-interativos-20261118, feat/jogos-v3-adaptativos-20261118]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17 (baseline AGP)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 17
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes, compilacao e lint
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
